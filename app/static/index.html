<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Buttercup Games — Splunk MCP Chat</title>
<style>
  :root {
    --bg: #0c0f14;
    --panel: #161b22;
    --panel-alt: #1d232c;
    --border: #2a323d;
    --text: #e6e9ed;
    --text-dim: #8b96a5;
    --green: #65a637;
    --green-bright: #8dc63f;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    max-width: 760px;
    margin: 0 auto;
    padding: 1.5rem 1rem 2rem;
  }
  header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem 1rem;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px 10px 0 0;
    border-bottom: 3px solid var(--green);
  }
  header h1 {
    font-size: 1.05rem;
    margin: 0;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  header .subtitle {
    font-size: 0.78rem;
    color: var(--text-dim);
    margin-top: 0.15rem;
  }
  #log {
    background: var(--panel);
    border: 1px solid var(--border);
    border-top: none;
    padding: 1rem;
    height: 58vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }
  .msg {
    max-width: 85%;
    padding: 0.55rem 0.8rem;
    border-radius: 8px;
    white-space: pre-wrap;
    line-height: 1.4;
    font-size: 0.92rem;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--green);
    color: #0c0f14;
    font-weight: 500;
    border-bottom-right-radius: 2px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--panel-alt);
    border: 1px solid var(--border);
    border-bottom-left-radius: 2px;
  }
  .msg.pending {
    align-self: flex-start;
    color: var(--text-dim);
    font-style: italic;
    font-size: 0.85rem;
  }
  .msg .label {
    display: block;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    opacity: 0.65;
    margin-bottom: 0.2rem;
  }
  form {
    display: flex;
    gap: 0.5rem;
    background: var(--panel);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 10px 10px;
    padding: 0.75rem;
  }
  input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.6rem 1rem;
    font-size: 0.92rem;
    color: var(--text);
  }
  input:focus {
    outline: none;
    border-color: var(--green-bright);
    box-shadow: 0 0 0 2px rgba(141, 198, 63, 0.25);
  }
  button {
    background: var(--green);
    color: #0c0f14;
    border: none;
    border-radius: 999px;
    padding: 0.6rem 1.3rem;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--green-bright); }
  footer {
    text-align: center;
    font-size: 0.72rem;
    color: var(--text-dim);
    margin-top: 0.75rem;
  }
</style>
</head>
<body>

<header>
  <svg width="34" height="34" viewBox="0 0 64 64" aria-hidden="true">
    <circle cx="32" cy="32" r="30" fill="#0c0f14" stroke="#2a323d"/>
    <g transform="translate(32,34)">
      <ellipse rx="6" ry="12" fill="#f5d020" transform="rotate(0)"/>
      <ellipse rx="6" ry="12" fill="#f5d020" transform="rotate(72)"/>
      <ellipse rx="6" ry="12" fill="#f5d020" transform="rotate(144)"/>
      <ellipse rx="6" ry="12" fill="#f5d020" transform="rotate(216)"/>
      <ellipse rx="6" ry="12" fill="#f5d020" transform="rotate(288)"/>
      <circle r="5" fill="#8dc63f"/>
    </g>
    <path d="M32 44 L32 58" stroke="#65a637" stroke-width="3" stroke-linecap="round"/>
    <path d="M32 52 L26 56" stroke="#65a637" stroke-width="3" stroke-linecap="round"/>
  </svg>
  <div>
    <h1>Buttercup Games — AI Ops Assistant</h1>
    <div class="subtitle">Splunk MCP &middot; Cisco Live AI Builders Workshop</div>
  </div>
</header>

<div id="log"></div>
<form id="chat-form">
  <input id="message" type="text" placeholder="Search> any high severity notables in the last 30 days?" autocomplete="off" required>
  <button type="submit">Search</button>
</form>
<footer>Answers are grounded in live Splunk data via MCP, traced to Galileo.</footer>

<script>
const log = document.getElementById("log");
const form = document.getElementById("chat-form");
const input = document.getElementById("message");
const conversationId = crypto.randomUUID(); // one Galileo session per page load

function addMessage(role, text) {
  const wrapper = document.createElement("div");
  wrapper.className = "msg " + role;
  if (role !== "pending") {
    const label = document.createElement("span");
    label.className = "label";
    label.textContent = role === "user" ? "You" : "Buttercup Assistant";
    wrapper.appendChild(label);
  }
  wrapper.appendChild(document.createTextNode(text));
  log.appendChild(wrapper);
  log.scrollTop = log.scrollHeight;
  return wrapper;
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const message = input.value.trim();
  if (!message) return;

  addMessage("user", message);
  input.value = "";
  const pending = addMessage("pending", "Searching Splunk...");

  try {
    const response = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message, conversation_id: conversationId }),
    });
    if (!response.ok) throw new Error(`Server returned ${response.status}`);
    const data = await response.json();
    pending.remove();
    addMessage("assistant", data.reply);
  } catch (err) {
    pending.remove();
    addMessage("assistant", `Error: ${err.message}`);
  }
});
</script>
</body>
</html>
