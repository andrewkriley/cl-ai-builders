<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Splunk MCP Chat</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.25rem; }
  #log { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; height: 60vh; overflow-y: auto; margin-bottom: 1rem; }
  .msg { margin: 0.5rem 0; white-space: pre-wrap; }
  .user { font-weight: 600; }
  .assistant { color: #333; }
  .pending { color: #888; font-style: italic; }
  form { display: flex; gap: 0.5rem; }
  input { flex: 1; padding: 0.5rem; font-size: 1rem; }
  button { padding: 0.5rem 1rem; font-size: 1rem; }
</style>
</head>
<body>
<h1>Ask your Splunk data</h1>
<div id="log"></div>
<form id="chat-form">
  <input id="message" type="text" placeholder="e.g. any high severity notables in the last 30 days?" autocomplete="off" required>
  <button type="submit">Send</button>
</form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("chat-form");
const input = document.getElementById("message");

function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = (role === "user" ? "You: " : role === "pending" ? "" : "Agent: ") + text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const message = input.value.trim();
  if (!message) return;

  addMessage("user", message);
  input.value = "";
  const pending = addMessage("pending", "Thinking...");

  try {
    const response = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message }),
    });
    if (!response.ok) throw new Error(`Server returned ${response.status}`);
    const data = await response.json();
    pending.remove();
    addMessage("assistant", data.reply);
  } catch (err) {
    pending.remove();
    addMessage("assistant", `Error: ${err.message}`);
  }
});
</script>
</body>
</html>
